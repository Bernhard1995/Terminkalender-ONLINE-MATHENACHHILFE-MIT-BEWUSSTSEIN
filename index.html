<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONLINE-MATHENACHHILFE MIT BEWUSSTSEIN</title>

  <!-- Icon für Startbildschirm -->
  <link rel="icon" href="Firmenlogo.png">

  <!-- Manifest für PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family:sans-serif;
      text-align:center;
      padding:20px;
      background-color:#f5f5f5;
    }

    /* LOGO – Fall 2 (weißer Hintergrund im Bild) */
    .logo {
      width:200px;
      height:200px;
      background-image: url("Firmenlogo.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      mix-blend-mode: multiply;
      margin-bottom:20px;
    }

    button {
      padding:15px 30px;
      font-size:1.2rem;
      cursor:pointer;
      margin-top:10px;
    }

    #installBtn {
      display:none;
      margin-top:20px;
      background-color:#007acc;
      color:white;
      border:none;
      border-radius:10px;
    }
  </style>
</head>

<body>
  <div class="logo"></div>

  <h1>ONLINE-MATHENACHHILFE MIT BEWUSSTSEIN-TERMINE</h1>

  <button onclick="window.open('https://drive.google.com/file/d/1CvltwJfArknOPCB-cg8Fg-FvjTJa7oZK/view?usp=sharing','_blank')">
    Zum Kalender
  </button>

  <!-- Button für Android PWA-Installation -->
  <button id="installBtn">Zu meinen Apps hinzufügen</button>

  <script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
      }
    });
  </script>
</body>
</html>
