
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffda32">

  <title>ONLINE-MATHENACHHILFE MIT BEWUSSTSEIN</title>

  <link rel="icon" href="Firmenlogo.svg">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 16px 35px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      color: #222;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin: 10px auto;
    }

    h1 {
      font-size: clamp(21px, 4vw, 30px);
      margin: 12px 0 8px;
      font-weight: 800;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .main-container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .section {
      background: white;
      padding: 22px;
      margin: 20px 0;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .section h2 {
      font-size: 21px;
      margin: 0 0 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section h2::after {
      content: "";
      display: block;
      width: 55px;
      height: 4px;
      background: #ffda32;
      margin: 10px auto 0;
      border-radius: 5px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 390px;
      min-height: 52px;
      margin: 12px auto;
      padding: 13px 18px;
      background: #ffda32;
      color: #171717;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .button:hover {
      background: #f3c900;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }

    .button:active {
      transform: scale(0.98);
    }

    .button .symbol {
      font-size: 21px;
    }

    .whatsapp {
      background: #25D366;
      color: white;
    }

    .whatsapp:hover {
      background: #1db954;
    }

    .student-button {
      background: #fff3b0;
    }

    .footer {
      margin-top: 35px;
      padding: 20px 10px;
      border-top: 5px solid #e92727;
      background: #ffda32;
      font-size: 13px;
      line-height: 2;
    }

    .footer a {
      color: #222;
      text-decoration: none;
      margin: 0 7px;
    }

    #installBtn {
      display: none;
      margin: 25px auto;
      padding: 14px 22px;
      background: #222;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 12px 25px;
      }

      .logo {
        width: 120px;
        height: 120px;
      }

      .section {
        padding: 18px 14px;
      }

      .button {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <img src="Firmenlogo.svg"
       alt="Firmenlogo"
       class="logo">

  <h1>ONLINE-MATHENACHHILFE MIT BEWUSSTSEIN</h1>

  <p class="subtitle">

        <span class="symbol">🎓</span>

      </button>

      <button class="button"
        onclick="openResource('plaetze')">

      </button>

      <button class="button"
        onclick="openResource('faq')">
        <span class="symbol">📋</span>

      <button class="button"
        onclick="openResource('agb')">
        <span class="symbol">📝</span>
        AGBs & Anmeldeformular
      </button>

    </div>

<!--
    <!-- BESTEHENDE SCHÜLER -->

      <h2>📚 Bestehende Schüler</h2>

      <button class="button student-button"
        onclick="openResource('lernmaterial')">

    <!-- APP INSTALLATION -->
    <button id="installBtn">
      📲 Zu meinen Apps hinzufügen
    </button>
  </div>


  <!-- FUSSZEILE -->
  <div class="footer">

    <strong>ONLINE-MATHENACHHILFE MIT BEWUSSTSEIN</strong>

    <br>

    © 2026 Alle Rechte vorbehalten

  </div>


  <script>

    // ==================================
    // LINKS HIER EINTRAGEN
    // ==================================

    const resources = {

      flyer: "https://drive.google.com/drive/folders/1fkQLzwvy2_zZxLdEfJDcErmWiHp-VaTR?usp=drive_link",

      plaetze: "https://drive.google.com/drive/folders/1aslgjd7dNTq6LxYPACtWFJ_K1xmEgw-k",

      faq: "https://drive.google.com/drive/folders/1CEoAb88FPJG4Qf5wp_DdNv_3rTOOvOo7",

      agb: "https://drive.google.com/drive/folders/1NJUIkSHqdWqSP_eJ3Q7qiCnUA8eJYW5l",

      lernmaterial: "LINK_LERNMATERIALIEN",

      termine: "https://drive.google.com/drive/folders/1gwk87t0EOa08elvETj79LlHhstuPisRH",

      impressum: "LINK_IMPRESSUM",

      datenschutz: "LINK_DATENSCHUTZ"

    };


    // ==================================
    // DOKUMENTE UND LINKS ÖFFNEN
    // ==================================

    function openResource(name) {

      const url = resources[name];

      if (!url || url.startsWith("LINK_")) {
        alert("Dieser Bereich wird gerade vorbereitet. Bitte versuche es später erneut.");
        return;
      }

      window.open(url, "_blank", "noopener,noreferrer");

    }


    // ==================================
    // WHATSAPP NACHRICHTEN
    // ==================================

    function openWhatsApp(message) {

      const url = "https://wa.me/436801420688?text="
                  + encodeURIComponent(message);

      window.open(url, "_blank");

    }


    // ==================================
    // APP INSTALLATION
    // ==================================

    let deferredPrompt;

    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {

      e.preventDefault();

      deferredPrompt = e;

      installBtn.style.display = 'block';

    });


    installBtn.addEventListener('click', async () => {

      if (deferredPrompt) {

        deferredPrompt.prompt();

        await deferredPrompt.userChoice;

        deferredPrompt = null;

        installBtn.style.display = 'none';

      }

    });

  </script>

</html>
